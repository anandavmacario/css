<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilo</title>
</head>
<!-- CSS interno -->
 <!-- Ele fica dentro da tag <style> no <head> do HTML -->
<style>
    h1 {
        color: blue;
    }
</style>
<!-- CSS Externo - O MELHOR DE TODOS -->
 <link rel="stylesheet" href="./css/style.css"
<body>
    <!-- <CSS (Cascading Style Sheets) é o que dá forma, cor, design e estilo no HTML!--> 
    <!-- CSS Inline -->
    <!-- Definido diretamente na tag HTML, dentro do atributo style="" -->
<!-- Quando usar?
 Quando você precisa estilizar um único elemento rapidamente (ex:testar uma cor diferente em um botão) -->
<h1 style="Título em vermelho"
</body>
</html>
