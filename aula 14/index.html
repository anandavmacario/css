<body>
    <h1>FLEXBOX</h1>
    <p>O Flexbox (ou Flexible Box Layout) é um modelo de layout do CSS criado para facilitar a organização,
     alinhamento e distribuição de espaço entre elementos dentro de um container.</p>

     <div class="container">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
     </div>
